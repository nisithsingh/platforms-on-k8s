apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-environment
  namespace: argocd
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
        - values.yaml
    path: chapter-4/argo-cd/dev/
    repoURL: https://github.com/nisithsingh/platforms-on-k8s
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    syncOptions:
      # The dev namespace does not exist yet; let Argo CD create it.
      - CreateNamespace=true
